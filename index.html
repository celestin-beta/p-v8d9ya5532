"x-assur-totale":{nav:false,body:()=>`<h1>${W("Vous n'êtes pas éligible à l'aide juridictionnelle","La personne que vous représentez n'est pas éligible à l'aide juridictionnelle")}</h1><p>${W("Votre","Son")} assurance couvre ${W("vos","ses")} frais de justice.</p><p>L'aide juridictionnelle sert à payer les frais de justice que personne d'autre ne prend en charge. Si l'assurance les couvre en totalité, il n'y a rien à financer.</p><p>La situation peut évoluer. Si l'assurance revient sur sa décision, ou si elle ne couvre finalement qu'une partie des frais, revenez déposer la demande.</p>${exitBtns()}`},
"x-assur-contact":{nav:false,body:()=>`<h1>Veuillez d'abord contacter ${W("votre","son")} assurance</h1><p>${W("Votre","Son")} assurance couvre peut-être ${W("vos","ses")} frais juridiques.</p><p>L'aide juridictionnelle ne prend en charge que les frais qui ne sont pas couverts par l'assurance. L'assurance doit donc se prononcer en premier.</p><p>Adressez-lui le formulaire de demande d'intervention. Elle le retournera en indiquant ce qu'elle couvre et vous pourrez recommencer la demande.</p>${exitBtns("Télécharger le formulaire (cerfa 15173*03)")}`},

const RISK={low:"faible",medium:"moyen",high:"élevé"};function decEpic(id){return DEC.e.find(x=>x.id===Number(id))}
function decSLink(s){return `<a class="dlink" data-act="dgo" data-s="${s}">${s}</a>`}

function decStory(s,open){return `<details class="acc dstory" id="st-${s.id}"${open?" open":""}><summary><span class="sid">${s.id}</span>${e(s.t)}${s.h?` <span class="dbadge h">Étape humaine</span>`:""}${s.f.length?` <span class="dbadge">Figma · ${s.f.length}</span>`:""}</summary><div><dl><dt>Description</dt><dd>${e(s.d)}</dd><dt>Vérification</dt><dd>${e(s.v)}</dd><dt>Dépend de</dt><dd>${s.a.length?s.a.map(a=>typeof a==="string"&&a.includes(".")?decSLink(a):decELink(a)).join(" "):"—"}</dd><dt>Couvre</dt><dd>${s.c.join(", ")||"—"}</dd><dt>Risque</dt><dd>${RISK[s.r]||e(s.r)||"—"}</dd><dt>Maquettes Figma</dt><dd>${s.f.length?`<ul class="dfig">${s.f.map(f=>`<li><a href="${e(f.url)}" target="_blank" rel="noopener">${e(f.nom)}</a></li>`).join("")}</ul>`:"Pas de maquette dans le fichier Portail public"}</dd></dl></div></details>`}
function decoupageView(){

    <div class="tw"><table class="pj dplan"><thead><tr><th>Epic</th><th>Portail</th><th>Stories</th><th>Dépend de</th></tr></thead><tbody>${DEC.e.map(x=>`<tr><td><a class="dlink" data-act="dsel" data-sel="${x.id}">Epic ${x.id}</a> <b>${e(x.t)}</b><br><span class="small">${e(x.d)}</span></td><td>${x.g?"Greffe":"Public"}</td><td>${x.s.length}${x.s.some(s=>s.h)?`<br><span class="small">dont ${x.s.filter(s=>s.h).length} avec étape humaine</span>`:""}</td><td class="small">${x.a.map(a=>`Epic ${a.e}${a.n?" : "+e(a.n):""}`).join("<br>")||"—"}</td></tr>`).join("")}</tbody></table></div>
    <h2>Étapes humaines</h2><ul>${DEC.e.flatMap(x=>x.s.filter(s=>s.h)).map(s=>`<li>${decSLink(s.id)}${e(s.t)}</li>`).join("")}</ul>`;
  }else if(D.sel==="init"){
    c=`<p>${decBadges({risk:DEC.init.risk})}</p><h1>${e(DEC.init.t)}</h1><div class="dmd">${DEC.init.h}</div>`;

    ${x.f.length?`<div class="dfigbox"><b>Maquettes Figma de l'epic</b><ul class="dfig">${x.f.map(f=>`<li><a href="${e(f[1])}" target="_blank" rel="noopener">${e(f[0])}</a></li>`).join("")}</ul></div>`:""}${D.tab==="epic"?`<div class="dmd">${x.h}</div>`:`<p><button class="btn ghost sm" data-act="dall">${D.all?"Tout replier":"Tout déplier"}</button></p>${x.s.map(s=>decStory(s,D.all||D.open===s.id)).join("")}`}`;

function simNum(v){const n=Number(String(v??"").replace(/[\s  ]/g,"").replace(",","."));return isFinite(n)&&String(v??"").trim()!==""?n:null}
function simCalc(a){const z=a.zone;
  if(z==="nc"||z==="wf"){if(a.penal!=="oui")return{r:"nope"};const b=BAREME[z],k=simNum(a.charges)||0,m=simNum(a.mensuel);const inc=b.t*0.1*k;
    const th=x=>Math.floor(x+inc);return{r:m<=th(b.t)?"100":m<=th(b.p55)?"55":m<=th(b.p25)?"25":"non",cur:b.cur}}
  const b=BAREME[z==="pf"?"pf":"eur"],n=Math.max(1,Math.round(simNum(a.foyer)||1)),i=Math.min(n,7)-1,x=Math.max(0,n-7);const th=k=>b[k][i]+x*b.inc;
  const base=a.chg==="oui"?Math.round(2*(simNum(a.six)||0)*0.9):(simNum(a.rfr)||0);
  if((simNum(a.epargne)||0)>th("t")||(simNum(a.immo)||0)>b.immo[i]+x*b.incImmo)return{r:"non",pat:true,cur:b.cur};
  return{r:base<=th("t")?"100":base<=th("p55")?"55":base<=th("p25")?"25":"non",cur:b.cur}}
function simMissing(a){if(!a.zone)return"Indiquez où vous déposez votre demande.";

  if(!a.conflit)return"Indiquez si votre affaire vous oppose à une personne de votre foyer fiscal.";if(!(simNum(a.foyer)>=1))return"Indiquez le nombre de personnes de votre foyer fiscal.";
  if(!a.chg)return"Indiquez si vos revenus ont changé.";if(a.chg==="non"&&simNum(a.rfr)==null)return"Indiquez votre revenu fiscal de référence.";if(a.chg==="oui"&&simNum(a.six)==null)return"Indiquez vos revenus des six derniers mois.";return null}
function simOpt(k,v,l,d){const on=(S.sim.a[k]===v);return `<button type="button" class="opt ${on?"on":""}" role="radio" aria-checked="${on}" data-act="spick" data-k="${k}" data-v="${v}"><span class="radio"></span><span><b>${l}</b>${d?`<span class="d">${d}</span>`:""}</span></button>`}

function simuBlock(ctx){const sm=S.sim;const lbl="Estimer mes droits";

  const a=sm.a,cur=(a.zone==="pf"||a.zone==="nc"||a.zone==="wf")?"XPF":"€";const close=`<p><button class="btn ghost sm" data-act="simclose">Fermer l'estimation</button></p>`;
  if(sm.done){const r=simCalc(a);let h;
    if(r.r==="nope")h=`<h2 tabindex="-1" id="simh">Nous ne pouvons pas estimer vos droits</h2><p>Les plafonds publiés pour la Nouvelle-Calédonie et Wallis-et-Futuna ne concernent que les affaires pénales. Le bureau d'aide juridictionnelle examinera vos ressources.</p>`;
    else{const T={"100":["Vous seriez éligible à l'aide juridictionnelle totale.","L'État prendrait en charge la totalité des honoraires de l'avocat."],"55":["Vous seriez éligible à l'aide juridictionnelle partielle, au taux de 55 %.","L'État prendrait en charge 55 % des honoraires de l'avocat. Le reste serait à votre charge, et son montant est fixé avec l'avocat."],"25":["Vous seriez éligible à l'aide juridictionnelle partielle, au taux de 25 %.","L'État prendrait en charge 25 % des honoraires de l'avocat. Le reste serait à votre charge, et son montant est fixé avec l'avocat."],"non":["Vos ressources dépassent les plafonds.","D'après ce que vous avez indiqué, vous ne seriez pas éligible. Vous pouvez tout de même déposer une demande : seul le bureau d'aide juridictionnelle décide, et votre situation peut avoir changé."]}[r.r];

    return `<section class="simu" aria-labelledby="simh">${h}<div class="btns">${ctx==="parcours"?`<button class="btn" data-act="simcont">Continuer ma demande</button>`:`<button class="btn" data-act="start">Commencer ma demande</button>`}<button class="btn ghost" data-act="simredo">Refaire une estimation</button></div>${close}</section>`}
  let q=`<h2 tabindex="-1" id="simh">Estimer vos droits</h2><p class="small muted">Six questions, sans quitter la page. Vos réponses restent en mémoire si vous fermez l'estimation.</p>
  <h3>Où déposez-vous votre demande ? <small class="muted">obligatoire</small></h3><div class="opts" role="radiogroup">${simOpt("zone","fr","En France métropolitaine ou dans un département d'outre-mer","Guadeloupe, Guyane, Martinique, La Réunion, Mayotte, ainsi que Saint-Barthélemy, Saint-Martin et Saint-Pierre-et-Miquelon.")}${simOpt("zone","pf","En Polynésie française")}${simOpt("zone","nc","En Nouvelle-Calédonie")}${simOpt("zone","wf","À Wallis-et-Futuna")}${simOpt("zone","etr","Dans un autre pays")}</div>`;
  if(a.zone==="nc"||a.zone==="wf"){q+=`<h3>Votre affaire est-elle pénale ? <small class="muted">obligatoire</small></h3><div class="opts" role="radiogroup">${simOpt("penal","oui","Oui")}${simOpt("penal","non","Non")}</div>`;
    if(a.penal==="oui")q+=simField("Combien de personnes sont à votre charge ?","charges","Conjoint ou concubin, enfant ou parent à votre charge. Indiquez 0 si personne.")+simField("Quelle est la moyenne mensuelle de vos ressources personnelles, en XPF ?","mensuel","Sur la dernière année civile.")}
  else if(a.zone){q+=`<h3>Votre affaire vous oppose-t-elle à une personne de votre foyer fiscal ? <small class="muted">obligatoire</small></h3><p class="small muted">Par exemple un divorce, une séparation, ou un litige avec votre conjoint ou votre partenaire de PACS.</p><div class="opts" role="radiogroup">${simOpt("conflit","oui","Oui")}${simOpt("conflit","non","Non")}</div>`+

    `<h3>Vos revenus ont-ils changé depuis votre dernière déclaration d'impôts ? <small class="muted">obligatoire</small></h3><div class="opts" role="radiogroup">${simOpt("chg","oui","Oui")}${simOpt("chg","non","Non")}</div>`+
    (a.chg==="non"?simField(`Quel est votre revenu fiscal de référence, en ${cur} ?`,"rfr","Il figure sur votre dernier avis d'imposition."):"")+
    (a.chg==="oui"?simField(`Quel est le total des revenus nets imposables des six derniers mois, en ${cur} ?`,"six",a.conflit==="oui"?"Pour vous seulement, puisque l'affaire vous oppose à une personne de votre foyer.":"Pour toutes les personnes de votre foyer fiscal."):"")+
    simField(`Quel est le total de votre épargne, en ${cur} ?`,"epargne","Livrets, comptes, assurance vie. Un montant approximatif suffit.")+simField(`Quel est le total de votre patrimoine immobilier, hors logement principal, en ${cur} ?`,"immo","")}
  return `<section class="simu" aria-labelledby="simh">${q}${S.ui.simErr?`<div class="notice err"><p>${S.ui.simErr}</p></div>`:""}<div class="btns"><button class="btn" data-act="simgo">Voir l'estimation</button></div>${close}</section>`}
function simPrefill(){const a=S.sim.a;if(!S.sim.done||a.zone==="nc"||a.zone==="wf")return;const n=simNum(a.epargne),im=simNum(a.immo);
  if(n!=null&&!S.a.epargne){S.a.epargne=String(n);S.a._sim=true}if(im!=null&&im>0&&!S.a.immo){S.a.immo="autres";S.a.immoVal=String(im);S.a._sim=true}

const JTYPES=[["tout","Toutes"],["ca","Cours d'appel"],["tj","Tribunaux judiciaires"],["tprx","Tribunaux de proximité"],["cph","Conseils de prud'hommes"]];

function jmark(s,q){if(!q)return e(s);const n=jnorm(s),i=n.indexOf(jnorm(q));if(i<0)return e(s);return e(s.slice(0,i))+"<mark>"+e(s.slice(i,i+q.length))+"</mark>"+e(s.slice(i+q.length))}

  const q=S.ui.jq||"",ty=S.ui.jt||"tout",nq=jnorm(q);const lab={ca:"Cour d'appel",tj:"Tribunaux judiciaires",tprx:"Tribunaux de proximité",cph:"Conseils de prud'hommes"};
  let n=0;const groups=JUR.map(g=>{const okR=nq&&jnorm(g.r).includes(nq);const parts=[];
    for(const k of ["ca","tj","tprx","cph"]){if(ty!=="tout"&&ty!==k)continue;const list=k==="ca"?[g.ca]:g[k];const hit=list.filter(x=>!nq||okR||jnorm(x).includes(nq));if(hit.length){n+=hit.length;parts.push(`<div class="jg">${lab[k]}</div>`+hit.map(x=>`<button type="button" class="jo" data-act="jpick" data-v="${e(x)}">${jmark(x,q)}</button>`).join(""))}}
    return parts.length?`<h4>Ressort de la cour d'appel ${/^[AEIOUÉ]/.test(g.r)?"d'":"de "}${e(g.r)}</h4>`+parts.join(""):""}).join("");
  return `<p class="f" style="margin-bottom:4px"><label for="jq"><b>Juridiction qui a rendu la décision</b></label></p><p class="small muted" style="margin:0 0 4px">Tapez la ville ou le nom de la juridiction, ou parcourez la liste par cour d'appel.</p>
  <div class="jpick"><div class="jbar"><input id="jq" type="search" autocomplete="off" placeholder="Exemple : Lyon, prud'hommes de Lille…" value="${e(q)}" data-bind="ui.jq" data-live="1" aria-describedby="jn"><span id="jn" class="small muted" aria-live="polite">${n} juridiction${n>1?"s":""}</span></div>

  <details${S.ui.jautre?" open":""}><summary>La juridiction n'est pas dans la liste (tribunal de commerce, cour d'assises, autre)</summary>${field("Nom de la juridiction","ui.jautreTxt")}<p><button class="btn sec sm" data-act="jautre">Utiliser ce nom</button></p></details>

function numBlock(d){return d.nomos?`<div class="notice"><p><b>Votre numéro de référence : <span class="mono">${e(d.nomos)}</span></b><br>Ce numéro remplace le numéro de dépôt ${e(d.id)} que vous aviez reçu. C'est celui-ci qu'il faut indiquer dans tous vos échanges avec le bureau.</p></div>`:""}
function accuse(){const d=D(S.cur);if(!d.accuseConsulted){d.accuseConsulted=today()}

function gPieces(d){return d.pieces.map(p=>{const[l,c]=STATUT_PIECE[p.status];return `<div class="piece"><div class="hd"><b>${e(p.label)}</b><span class="row"><span class="chip ${c}">${p.utile&&p.status==="attendue"?"Utile à l'examen":l}</span>${p.status==="a_verifier"||p.status==="indisponible"?`<button class="btn sm" data-act="gpiece" data-p="${p.id}">Contrôler</button>`:""}${!p.utile||p.status==="attendue"?`<button class="btn sec sm" data-act="greq" data-p="${p.id}">${p.status==="validee"?"Redemander":"Demander"}</button>`:""}</span></div>${p.file?`<span class="small muted">${e(p.file)}${p.date?` · transmis le ${fr(p.date)}`:""}</span>`:""}${p.status==="refusee"?`<span class="small">Motif : ${e(p.motif)} · Précision : ${e(p.precision)}</span>`:""}${p.status==="indisponible"?`<span class="small">Le demandeur indique ne pas avoir ce document : ${e(p.reason||"")}</span>`:""}</div>`}).join("")}

    if(!live)d.pieces.forEach(p=>{if(!sel.includes(p.id))p.inReq=false});

    d.requests.push(r);d.history.push({d:today(),who:AGENT,t:`Demande de pièces envoyée (${sel.length} pièce${sel.length>1?"s":""})${r.origine?" · à l'initiative de : "+r.origine:""}`});
    mail(d,`Le bureau d'aide juridictionnelle vous demande des documents, demande n° ${d.nomos}`,mailDemande(d));
    S.g.page="detail";toast("Demande de pièces envoyée. Le dossier passe dans l'onglet En attente.")},
  gprolong:()=>{S.ui.prolong=!S.ui.prolong},
  gprolongOk:()=>{const m=document.getElementById("prMotif").value.trim(),n=Number(document.getElementById("prDays").value);if(!m||!n){toast("Saisissez un motif et un nombre de jours");return}
    const d=D(S.g.open);const r=lastReq(d);r.extra=(r.extra||0)+n;d.history.push({d:today(),who:AGENT,t:`Délai prolongé de ${n} jours : ${m}`});
    mail(d,`Nouvelle date limite pour votre demande n° ${d.nomos||d.id}`,`${salut(d)}<p>${AV(`Le bureau d'aide juridictionnelle vous accorde un délai supplémentaire. Vous avez désormais jusqu'au ${frl(reqDeadline(r))} pour envoyer les documents demandés.`,false)}</p><p>Motif : ${e(m)}</p>${refBlock(d)}`);S.ui.prolong=false;toast("Délai prolongé, le demandeur reçoit la nouvelle date limite")},
  gend:()=>{const d=D(S.g.open);const r=lastReq(d);r.ended=today();d.history.push({d:today(),who:AGENT,t:"Examen poursuivi sans les pièces manquantes de la demande du "+fr(r.sent)});toast("La demande passe en En instruction. Vous pourrez demander des pièces à tout moment.")}
};
ACT.demo=()=>{const on=!document.body.classList.contains("demo");document.body.classList.toggle("demo",on);try{localStorage.setItem("aj-demo",on?"1":"")}catch(x){}};
try{document.body.classList.add("demo")}catch(x){}
document.addEventListener("click",ev=>{const t=ev.target.closest("[data-act]");if(!t||t.disabled)return;ev.preventDefault();const f=ACT[t.dataset.act];if(f){f(t);render()}});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.bind){setPath(t.dataset.bind,t.value);save();if(t.dataset.live){clearTimeout(window._lv);window._lv=setTimeout(()=>{const pos=t.selectionStart;render();const n=document.getElementById(t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}},250)}}});
document.addEventListener("change",ev=>{const t=ev.target;if(t.dataset.actChange==="jump"&&t.value){if(!S.fc&&!["portail","aide","accueil","avant","concerne","pourqui","residence","assurance","fc","simu","mails"].includes(t.value)&&!t.value.startsWith("x-")){S.fc={prenom:"Camille",nom:"Durand",naissance:"1984-06-11",adresse:"17 rue Paul Bert, 69003 Lyon"}}if(ORG()&&!S.a.org)ACT.orgsearch();if(REP()&&!S.a.repr)S.a.repr={prenom:"Léa",nom:"Durand",naissance:"2012-04-03",adresse:"17 rue Paul Bert, 69003 Lyon"};go(t.value);render()}else if(t.dataset.bind&&t.tagName==="SELECT"){render()}});
try{S=JSON.parse(localStorage.getItem("aj-preversion-v4"))}catch(x){S=null}
if(!S||!S.demandes) S=init();
render();
</script>
