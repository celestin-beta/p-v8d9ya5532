<!doctype html><html lang="fr" data-theme="light"><head><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Préversion AJ scénario 1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout : barre de préversion en haut, puis le site (public ou greffe) dans une colonne de 1040 px, contenu + encart à droite */
:root{
  --bg:#f6f6f9; --surface:#ffffff; --fg:#1e1e2a; --muted:#5c5c70; --line:#dcdce6;
  --blue:#000091; --blue-ink:#ffffff; --blue-soft:#e8e8fb; --red:#c9191e; --red-soft:#fde9e9;
  --orange:#b34000; --orange-soft:#fff0e3; --green:#18753c; --green-soft:#e3f5e9;
  --proto:#23232f; --proto-fg:#f2f2f7; --proto-accent:#ffca00; --aval:#d9822b;
  --sans:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15151c; --surface:#1f1f29; --fg:#ececf3; --muted:#a6a6ba; --line:#363645;
  --blue:#8b8bff; --blue-ink:#0d0d2a; --blue-soft:#25254a; --red:#ff7a7f; --red-soft:#3d1c1f;
  --orange:#ffa96b; --orange-soft:#3b2616; --green:#5fd38d; --green-soft:#17332a;
  --proto:#0b0b10; --proto-fg:#f2f2f7; --proto-accent:#ffd84d; --aval:#f0a04b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15151c; --surface:#1f1f29; --fg:#ececf3; --muted:#a6a6ba; --line:#363645;
  --blue:#8b8bff; --blue-ink:#0d0d2a; --blue-soft:#25254a; --red:#ff7a7f; --red-soft:#3d1c1f;
  --orange:#ffa96b; --orange-soft:#3b2616; --green:#5fd38d; --green-soft:#17332a;
  --proto:#0b0b10; --proto-fg:#f2f2f7; --proto-accent:#ffd84d; --aval:#f0a04b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--proto)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--proto);color:var(--proto-fg);font-size:14px}
.proto .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:8px}
.proto .lab{font-weight:700;color:var(--proto-accent);letter-spacing:.04em;text-transform:uppercase;font-size:12px}
.seg{display:inline-flex;border:1px solid #55556a;border-radius:6px;overflow:hidden}
.seg button{background:transparent;color:var(--proto-fg);border:0;padding:5px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--proto-accent);color:#1a1a1a;font-weight:700}
.pbtn{background:transparent;color:var(--proto-fg);border:1px solid #55556a;border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
.pbtn:hover,.seg button:hover{border-color:var(--proto-accent)}
.proto .date{font-family:var(--mono);font-size:13px}
.spacer{flex:1}
header.site{background:var(--surface);border-bottom:1px solid var(--line)}
header.site .in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:14px}
.brand{display:flex;gap:12px;align-items:center}
.flag{width:6px;height:38px;background:linear-gradient(var(--blue) 0 33%,var(--surface) 33% 66%,var(--red) 66%);border:1px solid var(--line)}
.brand b{display:block;font-size:18px;line-height:1.2}
.brand small{color:var(--muted)}
.user{margin-left:auto;color:var(--muted);font-size:15px}
nav.sub{max-width:1100px;margin:0 auto;display:flex;gap:18px;flex-wrap:wrap;padding-block:6px;font-size:15px}
nav.sub a{color:var(--fg);text-decoration:none;padding:6px 0;border-bottom:2px solid transparent;cursor:pointer}
nav.sub a.on{border-color:var(--blue);color:var(--blue);font-weight:600}
main{max-width:1100px;margin:0 auto;padding-block:28px 56px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
h1{font-size:30px;line-height:1.2;margin:0 0 12px;text-wrap:balance}
h2{font-size:21px;margin:24px 0 8px;text-wrap:balance}
h3{font-size:17px;margin:16px 0 6px}
p{margin:0 0 12px;max-width:68ch}
.lead{color:var(--muted);font-size:17px}
.muted{color:var(--muted)}
.small{font-size:14px}
.mono{font-family:var(--mono);font-size:.92em}
.aside{background:var(--blue-soft);border-radius:8px;padding:16px 18px;font-size:15px}
.aside h3{margin-top:0}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-soft)}
.opt small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.radio{flex:none;width:18px;height:18px;border:2px solid var(--muted);border-radius:50%;margin-top:3px}
.opt.on .radio{border-color:var(--blue);background:radial-gradient(var(--blue) 0 4px,transparent 5px)}
.chk .radio{border-radius:4px}
.chk.on .radio{background:var(--blue);box-shadow:inset 0 0 0 3px var(--surface)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:var(--blue-ink);border:1px solid var(--blue);border-radius:6px;padding:9px 18px;font:600 16px var(--sans);cursor:pointer;text-decoration:none}
.btn.sec{background:transparent;color:var(--blue)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue);padding-inline:6px}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{font-size:14px;padding:5px 10px}
:focus-visible{outline:3px solid var(--proto-accent);outline-offset:2px}
label.f{display:block;font-weight:600;margin:14px 0 4px}
label.f small{display:block;font-weight:400;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;max-width:440px;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-bottom:2px solid var(--fg);border-radius:4px 4px 0 0;padding:8px 10px}
textarea{max-width:100%;min-height:84px}
.notice{border-left:4px solid var(--blue);background:var(--blue-soft);padding:12px 14px;border-radius:0 6px 6px 0;margin:14px 0}
.notice.warn{border-color:var(--orange);background:var(--orange-soft)}
.notice.err{border-color:var(--red);background:var(--red-soft)}
.notice.ok{border-color:var(--green);background:var(--green-soft)}
.notice p:last-child{margin-bottom:0}
.aval{outline:2px dashed var(--aval);outline-offset:3px;border-radius:2px}
.avtag{display:inline-block;font:600 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--aval);border:1px solid var(--aval);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:middle}
.stepper{margin-bottom:18px}
.stepper .t{font-weight:700}
.stepper .bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:8px 0 4px}
.stepper .bar i{height:6px;border-radius:3px;background:var(--line)}
.stepper .bar i.done{background:var(--blue)}
.stepper .bar i.cur{background:linear-gradient(90deg,var(--blue) 50%,var(--line) 50%)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-block;border-radius:4px;padding:1px 8px;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.red{color:var(--red);background:var(--red-soft);border-color:transparent}
.chip.orange{color:var(--orange);background:var(--orange-soft);border-color:transparent}
.chip.green{color:var(--green);background:var(--green-soft);border-color:transparent}
.chip.blue{color:var(--blue);background:var(--blue-soft);border-color:transparent}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0 0}
.tabs button{background:transparent;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 16px var(--sans);color:var(--fg);cursor:pointer}
.tabs button.on{border-color:var(--blue);color:var(--blue)}
.tabs .sep{width:1px;background:var(--line);margin:8px 6px}
.count{display:inline-block;min-width:22px;border-radius:11px;padding:0 7px;font-size:13px;margin-left:6px;background:var(--blue);color:var(--blue-ink)}
.count.n{background:var(--line);color:var(--fg)}
.tabintro{background:var(--surface);border:1px solid var(--line);border-top:0;padding:12px 16px;font-size:15px;color:var(--muted);margin-bottom:14px}
.flagred{color:var(--red);font-weight:700}
.piece{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--surface);display:grid;gap:6px}
.piece+.piece{margin-top:10px}
.piece .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.drop{border:1px dashed var(--muted);border-radius:6px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.modalbg{position:fixed;inset:0;background:rgba(10,10,20,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--fg);border-radius:10px;max-width:860px;width:100%;padding:24px;position:relative}
.viewer{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
@media (max-width:760px){.viewer{grid-template-columns:minmax(0,1fr)}}
.page{background:repeating-linear-gradient(var(--bg) 0 14px,var(--surface) 14px 22px);border:1px solid var(--line);aspect-ratio:1/1.3;max-width:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600;border-radius:4px}
.kv{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:4px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.mail{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:14px 16px}
.mail+.mail{margin-top:10px}
.mail .meta{font-size:13px;color:var(--muted)}
.hist{font-size:14px;border-left:2px solid var(--line);padding-left:12px;display:grid;gap:6px}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--proto);color:var(--proto-fg);padding:10px 16px;border-radius:8px;z-index:30;font-size:15px;max-width:calc(100% - 32px)}
.help{margin-top:36px;border-top:1px solid var(--line);padding-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;font-size:15px}
.legend{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.right{margin-left:auto}
.banner{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:14px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.info-band{background:var(--blue-soft);color:var(--blue);padding:10px 0}
.info-band .in{max-width:1040px;margin:0 auto;display:flex;gap:12px;align-items:flex-start}
.info-band p{margin:2px 0}.info-band .x{margin-left:auto;background:none;border:0;color:var(--blue);font-size:20px;cursor:pointer;line-height:1}
.hero{border-radius:6px;background:linear-gradient(120deg,#f4c8cc,#fbe9ea 70%,#fff);padding:72px 24px;text-align:center;margin:8px 0 32px;color:#161616}
.hero h1{margin:0 auto;max-width:640px;font-size:clamp(26px,4vw,38px);line-height:1.2}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin:16px 0 28px}
.tile{background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--blue);padding:22px;display:flex;flex-direction:column;gap:10px}
.tile h3{margin:0}.tile .btn{align-self:flex-start;margin-top:auto}
.callout{background:var(--surface);border-left:4px solid var(--blue);padding:20px 22px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:0 0 32px}
.callout>div{flex:1 1 300px}.callout h3{margin:0 0 6px}
.helpcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.helpcards>div{background:var(--surface);border:1px solid var(--line);padding:18px}
.helpcards h3{margin:0 0 6px;font-size:18px}
.aide{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
@media (max-width:760px){.aide{grid-template-columns:1fr}}
.side a{display:block;padding:6px 10px;border-left:2px solid transparent;color:var(--fg);text-decoration:none;cursor:pointer}
.side a.on{border-left-color:var(--blue);color:var(--blue);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 18px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);border-bottom:0;background:var(--blue-soft);color:var(--fg);padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--blue);border-top:2px solid var(--blue)}
details.acc{border-bottom:1px solid var(--line)}details.acc>summary{cursor:pointer;padding:12px 4px;font-weight:600;color:var(--blue);list-style-position:outside}
details.acc>div{padding:0 4px 12px}
.addr{padding-left:14px;border-left:3px solid var(--line)}
table.pj{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:15px}
table.pj th,table.pj td{border-bottom:1px solid var(--line);text-align:left;vertical-align:top;padding:8px}
table.pj th{background:var(--blue-soft)}
@media (max-width:640px){table.pj thead{display:none}table.pj td{display:block;border:0;padding:2px 0}table.pj tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}}
.lexidx{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}.lexidx a{padding:2px 8px;border:1px solid var(--line);text-decoration:none}
dl.lex dt{font-weight:700;margin-top:14px}dl.lex dd{margin:2px 0 0}
.sitefoot{border-top:3px solid var(--blue,#000091);margin-top:32px;padding:20px 0;background:var(--surface)}.sitefoot .fbrand{display:flex;gap:10px;align-items:center;margin-bottom:6px}.flinks{display:flex;flex-wrap:wrap;gap:6px 20px;list-style:none;padding:0;margin:10px 0}.flinks a{font-size:14px}
.dec{display:grid;grid-template-columns:270px 1fr;gap:28px;align-items:start}
.dec nav{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;border-right:1px solid var(--line);padding-right:12px}
.dec nav a{display:block;padding:6px 8px;border-left:3px solid transparent;color:var(--fg);text-decoration:none;font-size:15px;cursor:pointer}
.dec nav a.on{border-left-color:var(--blue);color:var(--blue);font-weight:700;background:var(--surface)}
.dec nav .grp{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 8px 4px;font-weight:700}
.dec nav small{color:var(--muted);font-weight:400}
.dmd h3{margin-top:26px;border-bottom:1px solid var(--line);padding-bottom:4px}.dmd ul{padding-left:22px}.dmd li{margin:4px 0}.dmd code{font-family:var(--mono);font-size:13px;background:var(--bg);padding:0 4px;border-radius:3px}
.dbadge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;margin-right:6px;vertical-align:middle;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.dbadge.g{background:#e3e3fd;color:#000091;border-color:#c1c1fb}.dbadge.p{background:#dffee6;color:#18753c;border-color:#b8f0c6}.dbadge.h{background:#fff0c2;color:#6b4a00;border-color:#e8b931}.dbadge.r{background:#ffe9e6;color:#b34000;border-color:#f8c6bd}
.dstory dl{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:8px 0}.dstory dt{font-weight:700;color:var(--muted);font-size:14px}.dstory dd{margin:0}
.dfig{margin:4px 0;padding-left:18px}.dfig li{margin:2px 0}.dfigbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);padding:10px 14px;margin:14px 0}
.dstory summary .sid{font-family:var(--mono);font-size:13px;margin-right:8px;color:var(--muted)}
.dlink{cursor:pointer;color:var(--blue);text-decoration:underline;font-family:var(--mono);font-size:13px;margin-right:6px}
table.dplan td,table.dplan th{vertical-align:top}table.dplan td:last-child{min-width:240px}
@media (max-width:760px){.dec{grid-template-columns:1fr}.dec nav{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px}.dstory dl{grid-template-columns:1fr}}
.jpick{border:1px solid var(--line);margin:6px 0 18px}
.jpick .jbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:var(--surface);border-bottom:1px solid var(--line)}
.jpick .jbar input{flex:1 1 220px;min-width:0;padding:8px 10px;font:inherit;border:1px solid var(--fg)}
.jpick .jtypes{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.jpick .jtypes button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.jpick .jtypes button[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.jpick .jlist{max-height:340px;overflow:auto;padding:0 10px 10px}
.jpick h4{position:sticky;top:0;background:#fff;margin:0;padding:10px 0 4px;font-size:14px;color:var(--blue);border-bottom:1px solid var(--line)}
.jpick .jg{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted,#666);margin:8px 0 2px}
.jpick .jo{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 8px;font:inherit;cursor:pointer;overflow-wrap:anywhere}
.jpick .jo:hover,.jpick .jo:focus{background:var(--blue-soft)}
.jpick mark{background:#fff0a8;padding:0}
.jsel{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border:1px solid var(--blue);background:var(--blue-soft);margin:6px 0 18px}
.simu{border:1px solid var(--line);border-left:4px solid var(--blue);padding:16px 18px;margin:14px 0;background:var(--surface)}
.simu h2{margin-top:0;font-size:20px}.simu .res{font-size:18px;font-weight:700;margin:6px 0}
.resume-band{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--blue);background:var(--blue-soft);padding:12px 16px;margin:0 0 18px}
.contact{background:var(--blue-soft);padding:18px;margin-top:28px}

/* ===== Habillage DSFR (léger) : couleurs, typo Marianne, formes ===== */
@font-face{font-family:Marianne;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Marianne;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Medium.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:Marianne;src:url(https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.12.1/dist/fonts/Marianne-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root,:root[data-theme="light"]{--bg:#ffffff;--surface:#ffffff;--fg:#161616;--muted:#666666;--line:#dddddd;
  --blue:#000091;--blue-ink:#f5f5fe;--blue-soft:#e3e3fd;--red:#e1000f;--red-soft:#ffe9e9;
  --orange:#b34000;--orange-soft:#fff4f3;--green:#18753c;--green-soft:#b8fec9;
  --sans:Marianne,arial,sans-serif;color-scheme:light}
body{background:#fff;font-family:var(--sans);font-size:16px;line-height:1.5}
h1{font-size:32px;line-height:40px;font-weight:700}h2{font-size:24px;line-height:32px}h3{font-size:20px;line-height:28px}
a{color:var(--blue);text-underline-offset:3px}
:focus-visible{outline:2px solid #0a76f6!important;outline-offset:2px}
/* En-tête : bloc-marque République française */
header.site{border-bottom:0;box-shadow:0 8px 8px 0 rgba(0,0,0,.06),0 1px 0 #ddd;position:relative;z-index:2}
header.site .in{padding-block:12px}
.brand{gap:20px}
.flag{width:auto;height:auto;background:none;border:0;display:flex;flex-direction:column;justify-content:center;padding-right:20px;border-right:1px solid #ddd;position:relative;padding-top:12px}
.flag::before{content:"République\A Française";white-space:pre;text-transform:uppercase;font:700 15px/1.05 var(--sans);letter-spacing:-.01em;color:#161616}
.flag::after{content:"Liberté\A Égalité\A Fraternité";white-space:pre;font:italic 400 9px/1.15 var(--sans);color:#161616;margin-top:5px}
.brand>.flag+div{position:relative}
.flag{background:linear-gradient(90deg,#000091 0 33.3%,#fff 33.3% 66.6%,#e1000f 66.6%) 0 0/30px 7px no-repeat}
.brand b{font-size:20px;font-weight:700}.brand small{font-size:14px;color:#3a3a3a}
nav.sub{border-top:1px solid #ddd;max-width:none;padding-inline:max(16px,calc((100% - 1100px)/2 + 16px));font-size:14px;font-weight:500;gap:0}
nav.sub a{padding:14px 16px;border-bottom:0;box-shadow:none}
nav.sub a:first-child{padding-left:0}
nav.sub a.on{color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue);font-weight:500}
.sitefoot{border-top:2px solid #000091}
.sitefoot .flag{padding-right:16px}
/* Boutons */
.btn{border-radius:0;border:0;font-weight:500;padding:8px 24px;min-height:40px;background:var(--blue);color:#f5f5fe}
.btn:hover{background:#1212ff}
.btn.sec{background:transparent;color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.btn.sec:hover{background:#f6f6f6}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:none;padding-inline:8px}
.btn.ghost:hover{background:#f6f6f6}
.btn.danger{background:#e1000f;color:#fff}
.btn.sm{min-height:32px;padding:4px 12px;font-size:14px}
/* Champs */
input[type=text],input[type=date],input[type=number],input:not([type]),select,textarea,.jpick .jbar input{background:#eee;border:0!important;border-radius:4px 4px 0 0;box-shadow:inset 0 -2px 0 0 #3a3a3a;padding:8px 16px;color:#161616}
label.f{font-weight:400}
/* Choix : boutons radio riches */
.opt{border-radius:0;border:1px solid #ddd;padding:14px 16px}
.opt:hover{background:#f6f6f6;border-color:#ddd}
.opt.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#fff}
.radio{border-color:var(--blue)}
/* Cartes, encadrés, tableaux */
.card,.piece,.mail,.tblw,.modal,.banner,.drop,.page{border-radius:0}
.card{border:1px solid #ddd}
.notice{border-radius:0;border:1px solid var(--blue);border-left:40px solid var(--blue);background:#fff;padding:14px 16px;position:relative}
.notice::before{content:"i";position:absolute;left:-28px;top:13px;width:16px;height:16px;border-radius:50%;background:#fff;color:var(--blue);font:700 12px/16px var(--sans);text-align:center}
.notice.warn{border-color:#b34000}.notice.warn::before{content:"!";color:#b34000}
.notice.err{border-color:#ce0500}.notice.err::before{content:"×";color:#ce0500}
.notice.ok{border-color:#18753c}.notice.ok::before{content:"✓";color:#18753c}
.aside,.contact{border-radius:0;background:#eeeeee;border-left:4px solid var(--blue)}
.simu{border:0;border-left:4px solid var(--blue);background:#f5f5fe;padding:24px}
.simu .res{color:var(--blue);font-size:20px}
.resume-band{border:0;border-left:4px solid var(--blue);background:#f5f5fe}
.hero{border-radius:0;background:#f5f5fe;color:#161616}
.tile{border:1px solid #ddd;border-bottom:4px solid var(--blue)}
th{background:#f6f6f6;color:#161616;text-transform:none;letter-spacing:0;font-size:14px;font-weight:700}
.tblw{border:0;box-shadow:inset 0 0 0 1px #ddd}
table.pj th{background:#f6f6f6}
/* Badges DSFR */
.chip{border-radius:4px;border:0;text-transform:uppercase;font-size:12px;font-weight:700;padding:2px 8px;background:#eee;color:#3a3a3a}
.chip.red{background:#ffe9e9;color:#ce0500}.chip.orange{background:#ffe9e6;color:#b34000}
.chip.green{background:#b8fec9;color:#18753c}.chip.blue{background:#e8edff;color:#0063cb}
.count{border-radius:12px}
/* Indicateur d'étapes DSFR */
.stepper .t{font-size:20px}
.stepper .bar{gap:4px}.stepper .bar i{height:8px;border-radius:0;background:#eee}
.stepper .bar i.done,.stepper .bar i.cur{background:var(--blue)}
/* Onglets */
.tabs button{border-radius:0}
.tabs button.on,.tabs button[aria-selected=true]{color:var(--blue);box-shadow:inset 0 2px 0 var(--blue)}
.jpick,.jsel{border-radius:0}.jpick .jtypes button{border-radius:16px}
/* ===== Mode démo : masque les annotations de travail ===== */
body.demo .legend,body.demo .avtag{display:none!important}
body.demo .aval{outline:0!important}
.pbtn.on{background:var(--proto-accent);color:#1a1a1a;border-color:var(--proto-accent);font-weight:700}
.scrref{margin:40px 0 0;padding-top:8px;border-top:1px solid #e5e5e5;font:12px/1.4 ui-monospace,Menlo,monospace;color:#666}</style></head><body>

const AIDE = {"faq": [{"t": "Comprendre l'aide juridictionnelle", "qs": [{"q": "Qu'est-ce que l'aide juridictionnelle ?", "a": "<p>L'aide juridictionnelle, c'est l'État qui paie tout ou partie de vos frais de justice quand vos ressources sont faibles. Devant la Cour de cassation, elle couvre surtout les honoraires de l'avocat aux Conseils, l'avocat obligatoire devant cette Cour.</p><p>Il existe trois niveaux d'aide :</p><ul><li>l'aide totale : l'État paie tous les frais couverts ;</li><li>l'aide partielle à 55 % : l'État paie 55 % des frais, vous payez le reste ;</li><li>l'aide partielle à 25 % : l'État paie 25 % des frais, vous payez le reste.</li></ul><p>Avec une aide partielle, votre avocat vous dira quelle part reste à votre charge.</p>"}, {"q": "Qui peut demander l'aide juridictionnelle ?", "a": "<p>Vous pouvez la demander si vous êtes une personne et que vos ressources sont faibles, et si vous êtes dans l'une de ces situations :</p><ul><li>vous êtes de nationalité française ;</li><li>vous êtes ressortissant d'un pays de l'Union européenne ;</li><li>vous êtes d'une autre nationalité et vous résidez habituellement et régulièrement en France.</li></ul><p>Une association ou un organisme à but non lucratif peut aussi la demander, s'il a son siège en France et des ressources insuffisantes. Une entreprise ne le peut pas.</p><p>Le bureau tient compte de vos revenus, de votre épargne et des biens que vous possédez, selon des plafonds fixés chaque année. Pour savoir si vous êtes concerné, utilisez le simulateur de la page Aide juridictionnelle : il ne vous demande que quelques informations.</p>"}, {"q": "Le simulateur me dit que je suis au-dessus des plafonds. Puis-je quand même faire une demande ?", "a": "<p>Oui. Le simulateur donne seulement une estimation. Seul le bureau décide, après avoir lu votre demande et vos documents.</p>"}, {"q": "Dans quels cas demander l'aide juridictionnelle à la Cour de cassation ?", "a": "<p>Vous pouvez la demander dans trois cas :</p><ul><li>vous voulez former un pourvoi en cassation contre une décision de justice ;</li><li>vous avez déjà formé un pourvoi et vous voulez le poursuivre ;</li><li>l'autre partie a formé un pourvoi contre vous et vous voulez vous défendre.</li></ul><p>L'aide vaut pour toute la procédure devant la Cour de cassation. Elle vaut aussi pour l'exécution de la décision de la Cour.</p>"}, {"q": "Que vérifie le bureau d'aide juridictionnelle ?", "a": "<p>Le bureau vérifie deux choses.</p><ul><li><b>Vos ressources</b> : vos revenus, votre épargne et vos biens, comparés aux plafonds.</li><li><b>Les chances de votre pourvoi</b> : la Cour de cassation ne rejuge pas votre affaire. Elle vérifie seulement que les juges ont bien appliqué le droit. Le bureau regarde donc s'il existe un argument de droit sérieux contre la décision que vous contestez. Pour cela, il s'appuie sur l'avis d'un avocat aux Conseils.</li></ul><p>Avoir des ressources faibles ne suffit donc pas à obtenir l'aide pour former un pourvoi.</p>"}, {"q": "Je me défends contre un pourvoi formé par l'autre partie. Qu'est-ce qui change ?", "a": "<p>Le bureau ne vérifie pas les chances du pourvoi. Il examine seulement vos ressources.</p><p>Si vous aviez déjà l'aide juridictionnelle dans cette affaire, devant la juridiction précédente, vous la gardez pour vous défendre devant la Cour de cassation, au même taux : 100 %, 55 % ou 25 %. Vos ressources et votre patrimoine ne sont pas examinés à nouveau. C'est l'article 8 de la loi du 10 juillet 1991.</p><p>Ajoutez à votre demande la décision qui vous avait accordé l'aide. Le bureau ne peut pas la rechercher à votre place.</p>"}, {"q": "Je suis victime d'un crime grave. Mes ressources comptent-elles ?", "a": "<p>Non. Les victimes des crimes les plus graves, et leurs proches, sont dispensées de condition de ressources quand elles demandent réparation de leur préjudice. Les crimes concernés sont le meurtre, l'assassinat, l'empoisonnement, les tortures et actes de barbarie, le viol, les violences ayant entraîné la mort, une mutilation ou une infirmité permanente, les violences habituelles sur un mineur ou une personne vulnérable, et les actes de terrorisme portant atteinte à la personne. C'est l'article 9-2 de la loi du 10 juillet 1991.</p><p>Dans le formulaire, l'étape Ressources est alors marquée « Sans objet ».</p>"}, {"q": "J'ai une assurance de protection juridique. Puis-je demander l'aide ?", "a": "<p>Votre assurance, ou parfois votre employeur, peut déjà payer vos frais de justice. Regardez votre contrat ou appelez votre assureur.</p><ul><li>Si votre assurance paie tous les frais, vous ne pouvez pas obtenir l'aide juridictionnelle.</li><li>Si elle en paie une partie, l'aide peut couvrir le reste. Joignez l'attestation de votre assureur, avec le montant qu'il prend en charge.</li><li>Si elle refuse de payer, joignez sa lettre de refus.</li><li>Si vous ne savez pas, dites-le dans le formulaire : une attestation vous sera demandée.</li></ul>"}, {"q": "Faire la demande est-il payant ?", "a": "<p>Non. Demander l'aide juridictionnelle est gratuit, en ligne comme sur papier.</p>"}, {"q": "Faut-il un avocat ?", "a": "<p>Oui. Devant la Cour de cassation, un avocat aux Conseils est obligatoire. C'est un avocat spécialisé, le seul autorisé à vous représenter devant la Cour de cassation et le Conseil d'État.</p><p>Vous avez deux possibilités :</p><ul><li>vous avez déjà un avocat aux Conseils qui accepte de vous défendre avec l'aide juridictionnelle : ajoutez sa lettre d'acceptation ;</li><li>vous n'en avez pas : demandez qu'un avocat aux Conseils vous soit désigné. Si l'aide vous est accordée, la décision vous dira lequel.</li></ul>"}, {"q": "La demande d'aide juridictionnelle, est-ce un pourvoi ?", "a": "<p>Non. La demande d'aide juridictionnelle est une démarche à part. Elle ne saisit pas la Cour de cassation. Le pourvoi est fait par votre avocat aux Conseils, ou, en matière pénale, par une déclaration au greffe de la juridiction qui a rendu la décision.</p>"}]}, {"t": "Les délais", "qs": [{"q": "Quand dois-je faire ma demande ?", "a": "<p>Faites votre demande le plus tôt possible, avant la fin du délai pour former un pourvoi.</p><ul><li><b>En matière civile</b> (famille, travail, logement, dettes, contrats, etc.), le délai est indiqué dans la lettre de notification ou dans l'acte de signification de la décision. Il est le plus souvent de deux mois. Il compte à partir du jour où la décision vous a été notifiée ou signifiée. Il est allongé d'un mois si vous habitez en outre-mer, et de deux mois si vous habitez à l'étranger.</li><li><b>En matière pénale</b>, le délai est très court : dix jours francs, le plus souvent à partir du jour où la décision a été rendue.</li></ul><p>Un jour franc est un jour entier, de 0 h à 24 h. Le jour de la décision ne compte pas. Si le dernier jour tombe un samedi, un dimanche ou un jour férié, le délai va jusqu'au jour ouvrable suivant.</p>"}, {"q": "Ma demande arrête-t-elle le délai de pourvoi ?", "a": "<ul><li><b>En matière civile, oui</b>, si vous faites votre demande avant la fin du délai. Le délai s'arrête. Un nouveau délai, entier, commence quand la décision du bureau vous est notifiée, ou plus tard si un avocat est désigné après. Attention : si l'aide vous a été refusée et que vous refaites une demande pour la même affaire, le délai ne s'arrête pas une seconde fois.</li><li><b>En matière pénale, non.</b> Votre demande d'aide n'arrête pas le délai. Vous devez déclarer votre pourvoi au greffe de la juridiction qui a rendu la décision, dans le délai, même si vous attendez la réponse du bureau.</li></ul><p>En ligne, votre demande compte au moment où vous l'envoyez. Sur papier, envoyez-la le plus tôt possible.</p>"}, {"q": "Combien de temps dure l'examen de ma demande ?", "a": "<p>Cela dépend de chaque dossier : nous ne pouvons pas vous donner de durée. Votre espace vous montre où en est votre demande. Le bureau vous écrit s'il a besoin d'autres documents.</p>"}]}, {"t": "Faire la demande en ligne", "qs": [{"q": "De quoi ai-je besoin pour commencer ?", "a": "<ul><li>Un compte FranceConnect (voir plus bas).</li><li>La décision de justice que vous contestez, ou celle de l'autre partie si vous vous défendez.</li><li>Si possible, vos documents : votre dernier avis d'imposition, vos relevés d'épargne, la lettre de votre avocat s'il a déjà accepté de vous défendre.</li></ul><p>Vous n'avez pas tout ? Commencez quand même. Votre demande s'enregistre au fil de l'eau. Vous pourrez ajouter des documents plus tard, même après l'envoi.</p>"}, {"q": "Qu'est-ce que FranceConnect ?", "a": "<p>FranceConnect vous permet de vous connecter avec un compte que vous avez déjà ailleurs, par exemple celui des impôts (impots.gouv.fr), de l'Assurance maladie (ameli), de l'Identité Numérique La Poste ou de France Identité. Vous n'avez pas de nouveau mot de passe à créer.</p><p>Pour la demande d'aide juridictionnelle en ligne, FranceConnect est obligatoire. Grâce à lui, vous n'avez pas à fournir de pièce d'identité, et le bureau reçoit directement vos informations fiscales.</p>"}, {"q": "Je n'ai pas de compte FranceConnect, ou je n'arrive pas à me connecter.", "a": "<ul><li>Si vous déclarez vos impôts en ligne ou si vous avez un compte ameli, vous pouvez déjà utiliser FranceConnect avec ces identifiants.</li><li>Dans une France services, un conseiller peut vous aider à créer un compte et à vous connecter.</li><li>Vous pouvez aussi faire votre demande sur papier (voir « Faire la demande sur papier »).</li></ul>"}, {"q": "Je ne suis pas à l'aise avec Internet, ou je n'ai pas d'ordinateur.", "a": "<ul><li>Le formulaire fonctionne sur un téléphone.</li><li>Vous pouvez appeler le 01 44 32 95 95, du lundi au vendredi, de 8 h 30 à 17 h 30. Appel non surtaxé.</li><li>Dans un lieu d'aide près de chez vous (France services, point-justice, point d'accès au droit, maison de justice et du droit), des agents vous expliquent la démarche et peuvent vous prêter un ordinateur. Ils n'ont pas le droit de remplir la demande à votre place.</li><li>Vous pouvez aussi faire votre demande sur papier.</li></ul>"}, {"q": "Puis-je faire la demande pour quelqu'un d'autre ?", "a": "<ul><li><b>Oui, si vous êtes son représentant légal</b> : parent d'un enfant mineur, tuteur, ou personne habilitée par le juge (habilitation familiale). Vous vous connectez avec votre propre FranceConnect et vous déclarez les ressources de la personne que vous représentez.</li><li><b>Oui, pour une association ou un organisme à but non lucratif</b> : vous vous connectez avec votre FranceConnect et vous déposez au nom de l'organisme.</li><li><b>Pour un proche que vous aidez sans être son représentant légal</b> (un parent âgé, un ami), vous ne pouvez pas déposer à son nom. Vous pouvez l'aider à remplir sa demande à ses côtés : c'est elle qui se connecte avec son propre FranceConnect. Sinon, la demande se fait sur papier, avec un mandat signé de cette personne.</li></ul>"}, {"q": "Je dois m'arrêter en cours de route. Vais-je tout perdre ?", "a": "<p>Non. Votre demande s'enregistre automatiquement à chaque écran. Vous la retrouvez dans votre espace, là où vous vous êtes arrêté. Votre brouillon est gardé 90 jours après votre dernière modification. Nous vous prévenons par courriel avant qu'il soit supprimé.</p>"}, {"q": "J'habite en Polynésie française, en Nouvelle-Calédonie ou à Wallis-et-Futuna.", "a": "<p>La demande en ligne n'est pas possible pour vous. Faites votre demande sur papier.</p>"}, {"q": "Ma demande ne concerne pas un pourvoi en cassation.", "a": "<ul><li>Pour une requête ou un autre recours devant la Cour de cassation, faites la demande sur papier.</li><li>Pour une affaire devant le juge administratif (Conseil d'État), adressez-vous au bureau d'aide juridictionnelle du Conseil d'État.</li><li>Vous ne savez pas ? Commencez le formulaire : la première question vous oriente.</li></ul>"}, {"q": "Quelle est la différence entre courdecassation.fr et ce portail ?", "a": "<p>Le site courdecassation.fr présente la Cour de cassation, ses décisions et son actualité. Ce portail sert à faire vos démarches en ligne, comme la demande de certificat de non-pourvoi ou d'aide juridictionnelle, et à les suivre.</p>"}]}, {"t": "Vos documents", "qs": [{"q": "Quels documents dois-je fournir ?", "a": "<p>Cela dépend de votre situation. Le formulaire calcule la liste à partir de vos réponses et ne vous demande que les documents qui vous concernent. L'onglet « Pièces justificatives » présente tous les documents possibles.</p>"}, {"q": "Comment ajouter un document ?", "a": "<ul><li>Vous pouvez photographier le document avec votre téléphone. La photo doit être nette, et le document doit être entièrement visible et lisible. Les photocopies sont acceptées.</li><li>Formats acceptés : PDF, JPG, PNG et HEIC. 25 Mo au maximum par fichier.</li><li>Pour la décision de justice, ajoutez toutes les pages, même celles qui ne vous concernent pas directement.</li></ul>"}, {"q": "Je n'ai pas un des documents demandés.", "a": "<p>Envoyez votre demande quand même : aucun document manquant ne bloque l'envoi. Cliquez sur « Je n'ai pas ce document » et expliquez pourquoi en quelques mots. Le bureau en tiendra compte. Vous pourrez l'ajouter plus tard, si vous l'obtenez.</p>"}, {"q": "Puis-je ajouter un document après avoir envoyé ma demande ?", "a": "<p>Oui. Votre espace vous permet d'ajouter des documents à tout moment, même après l'envoi.</p>"}, {"q": "Combien de temps ai-je pour envoyer les documents qui manquent ?", "a": "<p>Après l'envoi, vous recevez un accusé de réception dans votre espace. Il liste les documents obligatoires qui manquent. Vous avez un mois pour les envoyer.</p><p>Pendant l'examen, le bureau peut aussi vous demander d'autres documents, à tout moment. Chaque demande indique la date limite. Nous vous envoyons des rappels avant cette date.</p><p>Si les documents obligatoires ne sont pas envoyés dans le délai, le bureau peut déclarer votre demande caduque : elle n'est plus valable et ne sera pas examinée. Cette décision ne peut pas être contestée. Vous pouvez cependant faire une nouvelle demande. En matière civile, une nouvelle demande pour la même affaire n'arrête pas une seconde fois le délai de pourvoi.</p>"}]}, {"t": "Après l'envoi", "qs": [{"q": "Comment suivre ma demande ?", "a": "<p>Dans votre espace, chaque demande a un statut :</p><ul><li><b>Non envoyée</b> : votre brouillon, pas encore envoyé ;</li><li><b>Reçue</b> : le bureau a reçu votre demande ;</li><li><b>En cours d'examen</b> : le bureau a enregistré votre demande et l'examine.</li></ul><p>Votre espace vous dit aussi si des documents vous sont demandés, et avant quelle date.</p>"}, {"q": "Le bureau me demande des documents. Que dois-je faire ?", "a": "<p>Vous recevez un courriel, et un SMS si vous avez donné votre numéro de portable. Connectez-vous à votre espace : la demande y liste les documents attendus et la date limite. Ajoutez-les directement en ligne. Si un document a été refusé, la raison est écrite à côté.</p>"}, {"q": "Le numéro de ma demande a changé.", "a": "<p>Quand le bureau enregistre votre demande, il lui donne un nouveau numéro. Votre espace affiche les deux numéros. Utilisez le nouveau pour toute question au bureau.</p>"}, {"q": "Comment connaîtrai-je la décision ?", "a": "<p>Vous recevrez la décision par courrier. En cas d'admission, la décision indiquera l'avocat désigné.</p>"}, {"q": "Je ne suis pas d'accord avec la décision.", "a": "<p>Un recours est possible dans certains cas. La décision vous indique s'il est possible, comment le faire et dans quel délai.</p>"}, {"q": "J'ai changé d'adresse.", "a": "<p>Prévenez le bureau sans attendre, pour recevoir la décision à la bonne adresse. Écrivez à baj.courdecassation@justice.fr, en donnant le numéro de votre demande et votre nouvelle adresse.</p>"}, {"q": "Je ne reçois pas les courriels.", "a": "<ul><li>Regardez dans vos courriers indésirables (spams).</li><li>Les courriels partent à l'adresse de votre compte FranceConnect, ou à celle que vous avez indiquée dans le formulaire.</li><li>Tout ce que nous vous envoyons est aussi dans votre espace : connectez-vous pour le voir.</li></ul>"}]}, {"t": "Faire la demande sur papier", "qs": [{"q": "Puis-je faire ma demande sur papier ?", "a": "<p>Oui. Téléchargez le formulaire, imprimez-le et remplissez-le. Vous pouvez aussi le demander dans un lieu d'aide. Joignez une copie de vos documents. Envoyez le tout à :</p><p class=\"addr\">Cour de cassation<br>Bureau d'aide juridictionnelle<br>5 quai de l'Horloge<br>TSA 19201 – 75055 Paris Cedex 01</p><p>Vous pouvez aussi le déposer à l'accueil de la Cour de cassation, au 5 quai de l'Horloge à Paris, du lundi au vendredi, de 8 h 30 à 17 h 30. Une demande sur papier ne s'envoie pas par courriel.</p><p>Une demande papier ne se suit pas dans l'espace en ligne : le bureau vous répond par courrier.</p>"}, {"q": "Je n'arrive pas à ouvrir ou à télécharger le formulaire.", "a": "<ul><li>Essayez avec un autre navigateur, ou sur un ordinateur plutôt que sur un téléphone.</li><li>Pour le lire, il faut un lecteur de fichiers PDF. La plupart des téléphones et des ordinateurs en ont déjà un.</li><li>Vous pouvez demander le formulaire imprimé dans un lieu d'aide, ou à l'accueil de la Cour.</li></ul><p>---</p>"}]}], "pieces": [{"t": "Votre identité et votre situation", "rows": [["Document qui justifie votre nationalité", "Selon la nationalité déclarée", "Une carte d'identité, un passeport ou un certificat de nationalité. Pour une demande en ligne, FranceConnect suffit souvent."], ["Titre de séjour ou document qui vous autorise à résider en France", "Vous n'êtes pas ressortissant de l'Union européenne", "Votre titre de séjour, ou le document qui vous autorise à résider en France."], ["Justificatif de votre résidence habituelle en France", "Vous n'êtes pas ressortissant de l'Union européenne", "Un document qui montre que vous vivez en France de façon habituelle."], ["Justificatif de résidence dans un pays de l'Union européenne", "Votre affaire concerne plusieurs pays de l'Union européenne", "Un document qui montre où vous vivez dans l'Union : facture, bail, attestation de la mairie, par exemple."], ["Livret de famille ou acte de naissance", "Pour justifier votre situation familiale", "Livret de famille tenu à jour, ou acte de naissance. Si vous n'êtes pas de nationalité française, tout document équivalent reconnu par les lois de votre pays. Ajoutez uniquement les pages des personnes de votre foyer."]], "notes": []}, {"t": "Vos ressources", "rows": [["Dernier avis d'imposition, ou avis de non-imposition", "Quand les services fiscaux n'ont pas transmis vos informations", "Le dernier avis que vous avez reçu des impôts."], ["Avis d'imposition étranger, ou document équivalent", "Vous déclarez vos revenus à l'étranger", "Le dernier avis des impôts du pays où vous déclarez vos revenus, ou un document officiel qui en tient lieu."], ["Justificatifs des revenus des six derniers mois", "Votre situation a changé : perte d'emploi, retraite, impossibilité de travailler pour raison de santé", "Bulletins de salaire, attestations de France Travail, de la caisse de retraite ou de la Sécurité sociale."], ["Justificatif de pension alimentaire", "Vous versez ou recevez une pension alimentaire", "Le jugement ou l'accord qui fixe la pension, ou des relevés de compte qui montrent les versements."], ["Attestation sur l'honneur d'absence de ressources", "Vous n'avez aucune ressource", "Un document daté et signé où vous déclarez ne pas avoir de revenus."]], "notes": []}, {"t": "Votre épargne et vos biens", "rows": [["Relevés d'épargne et contrats d'assurance vie", "Vous avez de l'épargne", "Le dernier relevé de chaque compte d'épargne ou contrat."], ["Justificatif de vos biens immobiliers", "Vous possédez un bien en dehors de votre résidence principale", "Par exemple, la taxe foncière ou une estimation du bien."]], "notes": ["Si vous n'avez ni épargne ni bien, aucun document n'est demandé."]}, {"t": "Votre assurance de protection juridique", "rows": [["Attestation de votre assurance de protection juridique", "Votre assurance paie une partie des frais", "Elle précise le montant et la nature des frais qu'elle prend en charge. L'aide juridictionnelle pourra couvrir le reste."], ["Attestation de non-prise en charge de votre assureur", "Votre assurance refuse de payer, ou vous ne savez pas", "La lettre de votre assureur qui dit qu'il ne paie pas."], ["Attestation de non-prise en charge de votre employeur", "La protection vient de votre employeur", "La lettre de votre employeur qui dit qu'il ne paie pas vos frais de justice dans cette affaire."]], "notes": []}, {"t": "Votre affaire", "rows": [["Copie complète de la décision que vous contestez", "Toujours. À envoyer en priorité", "La décision rendue en dernier ressort que vous contestez devant la Cour de cassation. Ajoutez toutes les pages, même celles qui ne vous concernent pas directement."], ["Acte de signification de la décision", "La décision vous a été remise par un commissaire de justice", "Si la décision vous a été remise par un commissaire de justice (anciennement huissier), ajoutez l'acte de signification plutôt que la notification."], ["Déclaration de pourvoi", "Vous avez déjà formé un pourvoi", "La déclaration de pourvoi faite au greffe de la juridiction qui a rendu la décision."], ["Conclusions, écritures ou observations", "Selon l'affaire", "Les écrits déposés par vous, par votre avocat ou par l'autre partie devant la juridiction dont vous contestez la décision."], ["Décision d'aide juridictionnelle antérieure", "Vous vous défendez et vous aviez déjà l'aide dans cette affaire", "La décision qui vous avait accordé l'aide juridictionnelle devant la juridiction précédente, à 100 %, 55 % ou 25 %. Vous gardez ce taux pour vous défendre. Le bureau ne peut pas la rechercher à votre place."], ["Lettre d'acceptation de l'avocat aux Conseils", "Vous avez déjà un avocat aux Conseils", "La lettre où votre avocat accepte de vous défendre avec l'aide juridictionnelle. Elle précise la procédure et dit si des honoraires ont déjà été payés."], ["Avis à victime, ou ordonnance du juge d'instruction", "Affaire pénale, vous êtes victime", "Le courrier du juge d'instruction qui vous informe de vos droits de victime, ou l'ordonnance qu'il a rendue dans l'affaire."]], "notes": []}, {"t": "Si vous représentez une personne", "rows": [["Justificatif de représentation d'un enfant mineur", "Vous êtes parent ou représentant légal d'un mineur", "Par exemple, le livret de famille ou une décision de justice."], ["Justificatif de la mesure de protection", "Vous êtes tuteur ou habilité par le juge", "Le jugement qui vous désigne."]], "notes": []}, {"t": "Si vous faites la demande pour une association ou un organisme", "rows": [["Compte annuel de la dernière année civile", ""], ["Budget prévisionnel de la dernière année civile", ""], ["Statuts de l'organisme", ""], ["Pièce d'identité en cours de validité du représentant légal", ""], ["Récépissé de déclaration en préfecture, ou publication au Journal officiel", ""]], "notes": []}], "intro": ["Le formulaire en ligne ne vous demande que les documents qui correspondent à votre situation. Cette liste les présente tous. Si vous faites votre demande en ligne, vous n'avez pas à fournir de pièce d'identité : FranceConnect suffit."], "lex": [{"m": "Accusé de réception", "d": "Document mis dans votre espace après l'envoi de votre demande. Il confirme que le bureau l'a reçue et liste les documents obligatoires qui manquent.", "k": "Accusé de réception", "l": "A"}, {"m": "Aide juridictionnelle (AJ)", "d": "Prise en charge par l'État de tout ou partie de vos frais de justice, si vos ressources sont faibles.", "k": "Aide juridictionnelle (AJ)", "l": "A"}, {"m": "Aide juridictionnelle partielle", "d": "L'État paie une partie des frais, 55 % ou 25 %. Vous payez le reste.", "k": "Aide juridictionnelle partielle", "l": "A"}, {"m": "Aide juridictionnelle totale", "d": "L'État paie tous les frais couverts par l'aide.", "k": "Aide juridictionnelle totale", "l": "A"}, {"m": "Arrêt", "d": "Nom donné à une décision rendue par une cour, comme la cour d'appel ou la Cour de cassation.", "k": "Arrêt", "l": "A"}, {"m": "Avis d'imposition", "d": "Document envoyé chaque année par les impôts. Il indique votre revenu fiscal de référence.", "k": "Avis d'imposition", "l": "A"}, {"m": "Avocat aux Conseils", "d": "Avocat spécialisé, le seul autorisé à vous représenter devant la Cour de cassation et le Conseil d'État. Il est obligatoire devant la Cour de cassation.", "k": "Avocat aux Conseils", "l": "A"}, {"m": "Ayant droit", "d": "Personne qui tient un droit d'une autre personne, souvent un membre de sa famille. Par exemple, l'enfant d'un parent décédé.", "k": "Ayant droit", "l": "A"}, {"m": "Brouillon", "d": "Demande commencée, pas encore envoyée. Elle s'enregistre toute seule et se garde 90 jours après votre dernière modification.", "k": "Brouillon", "l": "B"}, {"m": "Bureau d'aide juridictionnelle", "d": "Service de la Cour de cassation qui examine les demandes d'aide juridictionnelle et décide. Dans ce portail, on l'appelle « le bureau ».", "k": "Bureau d'aide juridictionnelle", "l": "B"}, {"m": "Caducité", "d": "Une demande caduque n'est plus valable et ne sera pas examinée, par exemple parce que des documents obligatoires n'ont pas été envoyés à temps. Cette décision ne peut pas être contestée, mais vous pouvez faire une nouvelle demande.", "k": "Caducité", "l": "C"}, {"m": "Commissaire de justice", "d": "Professionnel chargé notamment de remettre officiellement les décisions de justice et de les faire exécuter. On disait avant « huissier de justice ».", "k": "Commissaire de justice", "l": "C"}, {"m": "Conclusions", "d": "Document écrit où une partie expose ses demandes et ses arguments au juge.", "k": "Conclusions", "l": "C"}, {"m": "Concubin", "d": "Personne avec qui vous vivez en couple sans être marié ni pacsé.", "k": "Concubin", "l": "C"}, {"m": "Condamné", "d": "Personne reconnue coupable d'une infraction par une décision de justice définitive, et qui reçoit une sanction.", "k": "Condamné", "l": "C"}, {"m": "Condamné aux dépens", "d": "Personne qui doit payer les frais du procès, en tout ou en partie, à la fin de l'affaire.", "k": "Condamné aux dépens", "l": "C"}, {"m": "Décision en dernier ressort", "d": "Décision qui ne peut plus faire l'objet d'un appel. Par exemple, un arrêt de cour d'appel. C'est contre elle qu'on forme un pourvoi en cassation.", "k": "Décision en dernier ressort", "l": "D"}, {"m": "Décision en premier ressort", "d": "Décision contre laquelle on peut faire appel.", "k": "Décision en premier ressort", "l": "D"}, {"m": "Déclaration de pourvoi", "d": "Démarche qui forme le pourvoi. En matière pénale, elle se fait au greffe de la juridiction qui a rendu la décision.", "k": "Déclaration de pourvoi", "l": "D"}, {"m": "Délai de pourvoi", "d": "Temps dont vous disposez pour former un pourvoi en cassation. Il est indiqué sur la notification ou la signification de la décision.", "k": "Délai de pourvoi", "l": "D"}, {"m": "Dépens", "d": "Frais du procès, comme les frais de commissaire de justice ou d'expertise. Ils n'incluent pas les honoraires d'avocat.", "k": "Dépens", "l": "D"}, {"m": "Éligible", "d": "Vous êtes éligible quand vous remplissez les conditions pour obtenir un droit, par exemple l'aide juridictionnelle.", "k": "Éligible", "l": "E"}, {"m": "Épargne", "d": "Argent placé : livrets, comptes d'épargne, assurance vie, actions.", "k": "Épargne", "l": "E"}, {"m": "Foyer fiscal", "d": "Personnes déclarées ensemble aux impôts. Un couple marié ou pacsé forme un seul foyer fiscal. Deux concubins forment deux foyers fiscaux.", "k": "Foyer fiscal", "l": "F"}, {"m": "FranceConnect", "d": "Service qui vous permet de vous connecter à ce portail avec un compte que vous avez déjà, par exemple celui des impôts ou d'ameli.", "k": "FranceConnect", "l": "F"}, {"m": "G   if(reqPend(d).length)return today()>reqDeadline(r)?"reexaminer":"attente";
  if(accusePend(d).length)return today()>accuseDeadline(d)?"reexaminer":"attente";
  return"instruction";
}

function deadlineOf(d){return reqPend(d).length?reqDeadline(lastReq(d)):accusePend(d).length?accuseDeadline(d):null}
function tick(){ // trace le dépassement de délai une seule fois ; l'état, lui, se calcule

function piecesFor(a){
  const L=[],rep=a.pourQui==="rep",org=a.pourQui==="org";
  const add=(code,label,desc,utile)=>L.push({code,label,desc,utile:!!utile});
  add("DEC","Copie complète de la décision de justice contestée","Décision en dernier ressort que vous contestez devant la Cour de cassation. Ajoutez la décision complète, toutes les pages, y compris celles qui ne vous concernent pas directement.");
  if(a.matiere==="penal"||a.etat==="num") add("POURVOI","Déclaration de pourvoi","Déclaration de pourvoi faite au greffe de la juridiction qui a rendu la décision.");
  if(rep) add("REP",a.qualite==="parent"?"Livret de famille ou acte de naissance de l'enfant":"Décision de justice qui vous désigne comme représentant",a.qualite==="parent"?"Pour montrer que vous êtes son parent.":"Jugement de tutelle ou d'habilitation familiale.");
  if(org){add("PM-STATUTS","Statuts","Les statuts en vigueur de l'organisme.");add("PM-DECLA","Récépissé de déclaration en préfecture ou publication au Journal officiel","");add("PM-COMPTE","Compte annuel de la dernière année civile","");add("PM-BUDGET","Budget prévisionnel de la dernière année civile","");add("PM-ID-REP","Justificatif d'identité en cours de validité du représentant légal","Le représentant légal de l'organisme, par exemple son président.")}
  if(!org&&(a.nationalite==="ue"||a.nationalite==="autre")) add("ID-NAT","Document justifiant la nationalité déclarée","Pièce d'identité ou document équivalent.");
  if(!org&&a.nationalite==="autre") add("RES-HAB","Justificatif de résidence habituelle en France","Tout document qui montre "+(rep?"qu'elle réside":"que vous résidez")+" habituellement en France.");
  if(a.assurance==="partielle") add("ASS",(rep||org)?"Attestation de son assurance concernant la protection juridique":"Attestation de votre assurance concernant la protection juridique","Elle précise le montant et la nature des frais qu'elle prend en charge. L'aide juridictionnelle pourra couvrir le reste.");
  if(a.assurance==="refus") add("ASS","Attestation de non-prise en charge par l'assureur","");
  if(a.etat==="def"&&["100","55","25"].includes(a.ajant)) add("AJ-ANT","Décision d'aide juridictionnelle rendue devant la juridiction précédente","Elle montre le taux d'aide obtenu. Le bureau ne peut pas la rechercher à votre place.");
  if(a.etat==="def"&&a.ajant==="nsp") add("AJ-ANT","Décision d'aide juridictionnelle rendue devant la juridiction précédente, si vous en avez eu une","",true);
  if(a.crime==="oui"&&!(a.etat==="def"&&["100","55","25"].includes(a.ajant))) add("VICT","Justificatif de la situation de victime","");
  if(!org&&!rep&&a.rfrNone&&a.rfrCas==="jamais") add("RES-6M","Justificatifs de vos ressources des six derniers mois","Bulletins de salaire, attestations de France Travail, de la CAF ou de votre caisse de retraite.");
  if(!org&&(rep||(a.rfrNone&&a.rfrCas!=="jamais"))) add("RES-AVIS",rep?"Son dernier avis d'imposition sur le revenu":"Dernier avis d'imposition sur le revenu","");
  if(a.situation&&a.situation!=="non") add("SIT","Justificatif de changement de situation","");
  if(a.avocat==="deja") add("AVOCAT","Accord écrit de l'avocat aux Conseils","Lettre d'acceptation de l'avocat aux Conseils au titre de l'aide juridictionnelle.");
  if(a.signif==="oui") add("SIGN","Acte de signification de la décision attaquée","Si la décision a été remise par un commissaire de justice (anciennement huissier).",true);
  add("CONCL","Conclusions, écritures ou observations",org?"Déposées par l'organisme ou par son avocat devant la juridiction dont la décision est contestée.":rep?"Déposées par la personne que vous représentez ou par son avocat devant la juridiction dont la décision est contestée.":"Déposées par vous-même ou par votre avocat devant la juridiction dont vous contestez la décision.",true);
  return L;
}

  aside:()=>`<h3>Qu'est-ce que FranceConnect ?</h3><p>FranceConnect vous permet d'utiliser un compte que vous avez déjà, par exemple celui des impôts ou de l'Assurance Maladie. Vous n'aurez pas à chercher le numéro fiscal.</p>`,
  ok:()=>S.fc,next:()=>ORG()?"orgverif":"verif"},
fcsim:{nav:false,body:()=>`<div class="card" style="max-width:520px;margin:0 auto;text-align:center"><h1 style="font-size:24px">Choisissez un compte pour vous connecter</h1><div class="opts"><button class="opt" data-act="fcdone"><span class="radio"></span><span><b>impots.gouv.fr (fictif)</b><small>Camille Durand · née le 11/06/1984</small></span></button></div></div>`},
verif:{step:1,title:"Vérifiez vos informations",body:()=>`<p>Elles sont pré-remplies à partir de ce que vous avez déclaré.</p><dl class="kv"><dt>Civilité</dt><dd>Madame</dd><dt>Nom de naissance</dt><dd>${e(S.fc.nom)}</dd><dt>Prénom</dt><dd>${e(S.fc.prenom)}</dd><dt>Date de naissance</dt><dd>${fr(S.fc.naissance)}</dd><dt>Adresse</dt><dd>${e(S.fc.adresse)}</dd><dt>E-mail</dt><dd>camille.durand@exemple.fr</dd><dt>Téléphone</dt><dd>06 00 00 00 00</dd></dl><p style="margin-top:12px"><button class="btn sec sm" data-act="noop">Modifier</button></p>${REP()?``:""}`,
  aside:()=>`<h3>Pourquoi renseigner l'adresse ?</h3><p>C'est à cette adresse que la décision vous sera envoyée.</p>`,
  ok:()=>true,next:()=>REP()?"qualite":"nationalite"},
qualite:{step:1,title:"À quel titre représentez-vous cette personne ?",body:()=>opts("qualite",[
  {v:"parent",l:"Je suis son parent, et elle est mineure"},
  {v:"tuteur",l:"Je suis son tuteur"},
  {v:"habil",l:"Je suis habilité par le juge à la représenter (habilitation familiale)"},
  {v:"mandat",l:"J'ai un mandat d'elle pour faire cette demande",after:"Cette demande se fait alors sur papier."}]),
  ok:()=>S.a.qualite,next:()=>S.a.qualite==="mandat"?"x-papier-mandat":"represente"},
represente:{step:1,title:"Qui représentez-vous ?",body:()=>`<p>La demande est faite au nom de cette personne. Indiquez ses informations, pas les vôtres.</p>${field("Nom de naissance","a.repr.nom")}${field("Prénoms","a.repr.prenom")}${field("Date de naissance","a.repr.naissance",{type:"date"})}${field("Adresse","a.repr.adresse")}<div class="notice"><p>Vous restez la personne connectée : le bureau vous écrira dans votre espace.</p></div>`,
  ok:()=>S.a.repr&&S.a.repr.nom&&S.a.repr.prenom,next:()=>"nationalite"},
nationalite:{step:1,title:()=>W("Quelle est votre nationalité ?","Quelle est la nationalité de la personne que vous représentez ?"),body:()=>opts("nationalite",[
  {v:"fr",l:"Française"},{v:"ue",l:"Ressortissant·e d'un pays de l'Union européenne"},{v:"autre",l:"Autre"}]),
  aside:()=>`<h3>Pourquoi cette question ?</h3><p>${W("Votre nationalité ne conditionne pas votre droit","Sa nationalité ne conditionne pas son droit")} à l'aide juridictionnelle. Elle détermine seulement les documents qui ${W("vous","lui")} seront demandés.</p>`,
  ok:()=>S.a.nationalite,next:()=>S.a.nationalite==="autre"?"ordonnance":"type"},
ordonnance:{step:1,title:()=>W("Bénéficiez-vous d'une ordonnance de protection ?","Bénéficie-t-elle d'une ordonnance de protection ?"),body:()=>opts("ordonnance",[{v:"oui",l:"Oui"},{v:"non",l:"Non"},{v:"npr",l:"Je préfère ne pas répondre"}]),
  aside:()=>`<p>Une ordonnance de protection est une décision du juge aux affaires familiales qui protège une personne victime de violences au sein de son couple ou de sa famille.</p>`,
  ok:()=>S.a.ordonnance,next:()=>"type"},
type:{step:2,title:"De quel type d'affaire s'agit-il ?",body:()=>opts("matiere",[
  {v:"civil",l:"Civile",d:"Litige entre particuliers, entreprises ou associations : divorce, licenciement, loyer, succession, contrat, indemnisation. Inclut les affaires prud'homales, commerciales et sociales."},
  {v:"penal",l:"Pénale",d:"Une infraction est reprochée à quelqu'un : contravention, délit, crime. Vous êtes mis en cause, prévenu, condamné, ou partie civile."},
  {v:"nsp",l:"Je ne sais pas"}]),
  ok:()=>S.a.matiere,next:()=>S.a.matiere==="penal"?"typedec":"etat"},
typedec:{step:2,title:"Quelle décision contestez-vous ?",body:()=>`<p>Regardez l'en-tête de la décision que vous avez reçue. Le nom de la juridiction y figure.</p>`+opts("typeDec",TYPES_DEC),
  ok:()=>S.a.typeDec,next:()=>"pourvoipenal"},
pourvoipenal:{step:2,title:()=>W("Avez-vous déjà déclaré votre pourvoi ?","A-t-elle déjà déclaré son pourvoi ?"),body:()=>opts("pourvoiP",[{v:"oui",l:"Oui"},{v:"non",l:"Non, pas encore",after:W("Vous pouvez déposer votre demande même si vous n'avez pas encore formé votre pourvoi. Le bureau aura besoin de la preuve de votre déclaration de pourvoi pour examiner votre demande.","Vous pouvez déposer la demande même si la personne que vous représentez n'a pas encore formé son pourvoi. Le bureau aura besoin de la preuve de sa déclaration de pourvoi pour examiner la demande.")}]),
  ok:()=>S.a.pourvoiP,next:()=>"decision"},
etat:{step:2,title:()=>W("Avez-vous déjà déposé un pourvoi ?","A-t-elle déjà déposé un pourvoi ?"),body:()=>opts("etat",[
  {v:"pas",l:"Non, pas encore",after:S.a.matiere!=="civil"?`<p>Le bureau vous indiquera la suite à donner à votre pourvoi.</p>`:`<p>Déposer cette demande interrompt le délai, sauf si une première demande d'aide pour la même affaire a déjà été rejetée.</p><p>Cette demande ne forme pas le pourvoi à ${W("votre","sa")} place.</p>`},
  {v:"num",l:W("Oui, j'ai déjà un numéro de pourvoi","Oui, elle a déjà un numéro de pourvoi"),d:"Le pourvoi est engagé. La Cour de cassation a donné un numéro de pourvoi."},
  {v:"def",l:W("Oui, je suis en défense sur un pourvoi formé contre moi","Oui, elle est en défense sur un pourvoi formé contre elle"),d:W("Une autre partie s'est pourvue et vous devez vous défendre.","Une autre partie s'est pourvue et elle doit se défendre.")}]),
  aside:()=>`<h3>Qu'est-ce qu'un pourvoi ?</h3><p>C'est la démarche par laquelle on demande à la Cour de cassation de vérifier qu'une décision a bien appliqué la loi. La Cour ne rejuge pas les faits.</p>`,
  ok:()=>S.a.etat,next:()=>S.a.etat==="pas"?"decision":"numero"},
numero:{step:2,title:"Quel est le numéro de pourvoi ?",body:()=>field("Numéro de pourvoi","a.numPourvoi",{ph:"Ex. M 24-16.854"})+`<p class="small muted" style="margin-top:8px">Il figure sur l'accusé de réception de la déclaration de pourvoi. Recopiez-le comme il est écrit : les espaces, les points et les tirets sont acceptés.</p>`,
  ok:()=>!!normPV(S.a.numPourvoi),okMsg:"Nous ne reconnaissons pas ce numéro. Il comporte sept chiffres, souvent précédés d'une lettre, par exemple M 24-16.854.",next:()=>{S.a.numPourvoi=normPV(S.a.numPourvoi);return"retrouvee"}},
retrouvee:{step:2,title:"Nous avons retrouvé votre affaire",body:()=>`<p><b>Pourvoi n° ${e((S.a.numPourvoi||"").toUpperCase())} · Décision du 27/08/2026</b></p><p>Ces informations ont été récupérées depuis votre dossier : la décision contestée et sa date, la juridiction qui l'a rendue et son numéro de rôle, la qualité dans l'affaire, les parties à l'affaire, et l'avocat aux Conseils constitué s'il y en a un.</p><p>Par protection des données, nous ne les affichons pas ici. Elles seront transmises au bureau d'aide juridictionnelle avec la demande.</p>`,
  ok:()=>true,next:()=>{S.a.decision={juridiction:"Cour d'appel de Lyon",date:"2026-08-27",rg:"25/04120"};return"theme"}},
decision:{step:2,title:"Quelle décision contestez-vous ?",body:()=>`<p>Il s'agit des informations de la décision de justice rendue en dernier ressort.</p>${jurPicker()}${field("Numéro RG","a.decision.rg",{ph:"Exemple : 24/123456"})}${field("Date de la décision","a.decision.date",{type:"date",hint:"Indiquez la date à laquelle la décision a été prise, et non la date à laquelle elle a été notifiée ou signifiée."})}`,
  aside:()=>`<h3>Où trouver ces informations ?</h3><p>Sur la notification ou la signification de la décision reçue, ainsi qu'en première page de la décision elle-même. Le numéro de RG est encadré en haut de la première page, à gauche de la date.</p>`,
  ok:()=>S.a.decision&&S.a.decision.juridiction&&S.a.decision.date,next:()=>S.a.matiere==="penal"?"avocat":"signif"},
signif:{step:2,title:()=>W("La décision vous a-t-elle été remise par un commissaire de justice ?","La décision lui a-t-elle été remise par un commissaire de justice ?"),body:()=>`<p>Un commissaire de justice est le nouveau nom de l'huissier de justice.</p>`+opts("signif",[{v:"oui",l:"Oui, par un commissaire de justice"},{v:"courrier",l:W("Non, je l'ai reçue par courrier du tribunal","Non, elle l'a reçue par courrier du tribunal")},{v:"non",l:W("Je ne l'ai pas reçue","Elle ne l'a pas reçue")}]),
  ok:()=>S.a.signif,next:()=>"theme"},
theme:{step:2,title:"De quoi parle votre litige ?",body:()=>`<p>Choisissez le thème le plus proche. Cela permet d'orienter le dossier vers le service qui connaît ce type d'affaire.</p>`+opts("theme",["Argent, crédit, dette, contrat, vente","Famille, divorce, enfants, tutelle","Travail, licenciement, prud'hommes","Logement, loyer, copropriété, syndic","Accident, dommage, indemnisation","Sécurité sociale, maladie, retraite, invalidité","Autre, ou je ne sais pas"].map(x=>({v:x,l:x}))),
  ok:()=>S.a.theme,next:()=>S.a.etat==="pas"?"adversaire":"avocat"},
adversaire:{step:2,title:()=>W("Qui est votre adversaire dans cette affaire ?","Qui est son adversaire dans cette affaire ?"),body:()=>`<p>Ces informations conditionnent la liste des auxiliaires de justice qui pourront être désignés.</p>`+opts("advType",[{v:"pp",l:"Personne physique"},{v:"pm",l:"Personne morale"}])+field(S.a.advType==="pm"?"Raison sociale":"Nom et prénom","a.advNom"),
  ok:()=>S.a.advType&&S.a.advNom,next:()=>"avocat"},
avocat:{step:2,title:()=>W("Avez-vous un avocat aux Conseils ?","A-t-elle un avocat aux Conseils ?"),body:()=>opts("avocat",[
  {v:"deja",l:W("J'ai déjà un avocat aux Conseils qui a accepté de défendre mes intérêts","Elle a déjà un avocat aux Conseils qui a accepté de défendre ses intérêts")},
  {v:"cherche",l:W("Je vais en chercher un par moi-même","Je vais en chercher un")},
  {v:"designe",l:W("Je souhaite qu'un avocat aux Conseils me soit désigné","Je souhaite qu'un avocat aux Conseils lui soit désigné")}]),
  aside:()=>`<h3>Pourquoi un avocat aux Conseils ?</h3><p>Devant la Cour de cassation, la représentation par un avocat au Conseil d'État et à la Cour de cassation est obligatoire.</p>`,
  ok:()=>S.a.avocat,next:()=>S.a.etat==="def"?"ajant":(S.a.matiere==="penal"?RES0():"arguments")},
ajant:{step:2,title:()=>W("Avez-vous déjà bénéficié d'une aide juridictionnelle dans cette affaire ?","A-t-elle déjà bénéficié d'une aide juridictionnelle dans cette affaire ?"),body:()=>`<p>Devant la juridiction précédente, en première instance ou en appel.</p><p>${AV(W("Si c'est le cas, vous la gardez pour vous défendre devant la Cour de cassation, et vos ressources ne sont pas examinées (article 8 de la loi du 10 juillet 1991). Vous devrez joindre la décision d'aide juridictionnelle : le bureau ne peut pas la rechercher à votre place.","Si c'est le cas, elle la garde pour se défendre devant la Cour de cassation, et ses ressources ne sont pas examinées (article 8 de la loi du 10 juillet 1991). Vous devrez joindre la décision d'aide juridictionnelle : le bureau ne peut pas la rechercher à votre place."),false)}</p>`+opts("ajant",[{v:"100",l:"Oui, l'aide totale à 100 %"},{v:"55",l:"Oui, une aide partielle à 55 %"},{v:"25",l:"Oui, une aide partielle à 25 %"},{v:"non",l:"Non"},{v:"nsp",l:"Je ne sais pas",after:AV(W("Le bureau ne peut pas retrouver cette décision. Vos ressources seront examinées. Si vous retrouvez la décision d'aide juridictionnelle, ajoutez-la à vos documents.","Le bureau ne peut pas retrouver cette décision. Ses ressources seront examinées. Si vous retrouvez la décision d'aide juridictionnelle, ajoutez-la à ses documents."),false)}]),
  aside:()=>`<h3>Où trouver le taux ?</h3><p>Sur la décision du bureau d'aide juridictionnelle de la juridiction précédente.</p>`,
  ok:()=>S.a.ajant,next:()=>AJ8()?"ajres":RES0()},
ajres:{step:3,title:()=>W("Vos ressources : sans objet","Ses ressources : sans objet"),body:()=>`<div class="notice"><p>${AV(W("Vous gardez l'aide juridictionnelle obtenue devant la juridiction précédente, au même taux, pour vous défendre (article 8 de la loi du 10 juillet 1991). Vos ressources ne seront pas examinées.","Elle garde l'aide juridictionnelle obtenue devant la juridiction précédente, au même taux, pour se défendre (article 8 de la loi du 10 juillet 1991). Ses ressources ne seront pas examinées."),false)}</p><p>Joignez la décision d'aide juridictionnelle à l'étape suivante.</p></div>`,ok:()=>true,next:()=>"justif"},
arguments:{step:2,title:()=>ORG()||REP()?"Le bureau vérifie aussi les arguments de droit":"Le bureau vérifie aussi vos arguments de droit",body:()=>{const v=ORG()?["l'organisme conteste","ses","l'organisme se défend"]:REP()?["la personne que vous représentez conteste","ses","elle se défend"]:["vous contestez","vos","vous vous défendez"];return `<p>Le bureau d'aide juridictionnelle vérifie si la décision que ${v[0]} soulève un vrai problème de droit. S'il estime que non, il peut refuser l'aide, même si ${v[1]} ressources sont sous les plafonds.</p><p><b>Si ${v[2]} contre un pourvoi déposé par l'autre partie, cette vérification ne s'applique pas.</b></p>`+(ORG()?"":simuBlock("parcours"))+``},
  ok:()=>true,next:()=>RES0()},
crime:{step:3,title:()=>W("Êtes-vous victime d'un crime grave, ou proche d'une victime ?","La personne que vous représentez est-elle victime d'un crime grave, ou proche d'une victime ?"),body:()=>repBanner()+`<p>La loi dispense de condition de ressources les victimes des crimes les plus graves, ainsi que leurs proches, lorsqu'elles demandent réparation du préjudice subi.</p>`+opts("crime",[{v:"oui",l:W("Oui, je suis victime d'un crime parmi les plus graves","Oui, elle est victime d'un crime parmi les plus graves"),d:"Atteinte volontaire à la vie, viol, violences volontaires ayant entraîné une mutilation ou une infirmité permanente, acte de terrorisme."},{v:"non",l:W("Non, je ne suis pas victime de ces crimes","Non, elle n'est pas victime de ces crimes")},{v:"nsp",l:"Je ne sais pas"}]),
  aside:()=>`<h3>Les crimes concernés</h3><p>Meurtre, assassinat, empoisonnement, tortures et actes de barbarie, viol, violences ayant entraîné la mort, une mutilation ou une infirmité permanente, violences habituelles sur un mineur ou une personne vulnérable, et actes de terrorisme portant atteinte à la personne. Article 9-2 de la loi du 10 juillet 1991.</p>`,
  ok:()=>S.a.crime,next:()=>S.a.crime==="oui"?"dispense":(REP()?"rfrrep":"situation")},
dispense:{step:3,title:"Dispense pour les victimes les plus graves",body:()=>`<p>${W("Vos","Ses")} ressources ne seront pas examinées. Vous pouvez passer directement à l'étape suivante.</p>`,ok:()=>true,next:()=>"justif"},
rfrrep:{step:3,title:()=>`Quel est le revenu fiscal de référence de ${e(repName())} ?`,body:()=>repBanner()+`<p>Il figure sur son dernier avis d'imposition.</p>`+field("Revenu fiscal de référence (€)","a.rfr",{type:"number"})+`<div class="opts"><button class="opt chk ${S.a.rfrNone?"on":""}" data-act="toggle" data-k="rfrNone"><span class="radio"></span><span><b>Cette personne n'a pas de revenu fiscal de référence</b></span></button></div>`,
  ok:()=>S.a.rfr||S.a.rfrNone,next:()=>"situation"},
situation:{step:3,title:()=>W("Votre situation a-t-elle changé depuis votre dernière déclaration de revenus ?","Sa situation a-t-elle changé depuis sa dernière déclaration de revenus ?"),body:()=>repBanner()+(REP()?"":`<div class="tblw" style="margin:8px 0 6px"><table><tr><th>Revenu fiscal de référence</th><th>Année</th><th>Personnes dans le foyer fiscal</th></tr><tr><td class="num">14 820 €</td><td class="num">2025</td><td class="num">2</td></tr></table></div><p class="small muted">Ces informations nous ont été transmises par les services fiscaux. Vous ne pouvez pas les modifier.</p>`)+opts("situation",[
  {v:"non",l:"Non"},{v:"emploi",l:W("J'ai perdu mon emploi","Elle a perdu son emploi")},{v:"retraite",l:W("J'ai pris ma retraite","Elle a pris sa retraite")},{v:"sante",l:W("Je ne peux plus travailler pour raison de santé","Elle ne peut plus travailler pour raison de santé")},{v:"autre",l:"Autre changement",after:"Précisez en quelques mots."}])+(S.a.situation==="autre"?field("Précision","a.sitTxt"):"")+(REP()?"":`<p><button class="btn ghost" data-act="nofrf">Je n'ai pas de revenu fiscal de référence</button></p>`),
  aside:()=>`<p>Un changement de revenus ne vaut pas changement de situation : seuls les changements de la liste sont retenus (circulaire JUST2601659C, annexe 3).</p>`,
  ok:()=>S.a.situation,next:()=>(S.a.situation!=="non"||S.a.rfrNone)?"sixmois":"epargne"},
rfrcas:{step:3,title:"Votre revenu fiscal de référence n'apparaît pas",body:()=>opts("rfrCas",[
  {v:"declare",l:"J'ai déjà déclaré mes revenus",d:"Le revenu fiscal de référence aurait dû nous être transmis. Ajoutez votre dernier avis d'imposition à la fin du formulaire."},
  {v:"jamais",l:"Je n'ai jamais déclaré mes revenus",d:"Par exemple une première déclaration pas encore faite. Indiquez vos ressources des six derniers mois et joignez les justificatifs."}])+``,
  ok:()=>S.a.rfrCas,next:()=>{S.a.rfrNone=true;S.a.situation=S.a.situation||"non";return S.a.rfrCas==="jamais"?"sixmois":"epargne"}},
sixmois:{step:3,title:()=>W("Vos ressources des six derniers mois","Ses ressources des six derniers mois"),body:()=>repBanner()+`<p>Pour chaque ligne, indiquez un montant en euros net et entier. Laissez vide ce qui ne ${W("vous","la")} concerne pas.</p>`+field("Salaires ou traitements nets imposables, pensions, retraites, rentes","a.r6.sal",{type:"number"})+field("Pensions alimentaires ou prestations assimilées perçues","a.r6.pens",{type:"number"})+field("Tout autre revenu locatif ou du capital","a.r6.cap",{type:"number"}),
  ok:()=>true,next:()=>"epargne"},
epargne:{step:3,title:()=>W("Quel est le montant total de votre épargne ?","Quel est le montant total de son épargne ?"),body:()=>repBanner()+`<p>Livrets et comptes d'épargne, assurance vie, plan d'épargne salariale, actions, obligations, parts de société, et l'argent disponible sur les comptes courants.</p>`+field("Montant en euros","a.epargne",{type:"number"})+(S.a._sim?`<p class="small muted">Prérempli avec votre estimation. Vous pouvez le modifier.</p>`:""),
  ok:()=>S.a.epargne!==undefined&&S.a.epargne!=="",next:()=>"immo"},
immo:{step:3,title:()=>W("Êtes-vous propriétaire d'un bien immobilier ?","Est-elle propriétaire d'un bien immobilier ?"),body:()=>repBanner()+opts("immo",[
  {v:"rp",l:W("Oui, seulement de ma résidence principale ou d'un bien servant à mon activité professionnelle","Oui, seulement de sa résidence principale ou d'un bien servant à son activité professionnelle")},
  {v:"autres",l:"Oui, d'un ou plusieurs autres biens immobiliers"},{v:"non",l:W("Non, je ne suis pas propriétaire","Non, elle n'est pas propriétaire")}])+(S.a.immo==="autres"?field("Valeur estimée du ou des biens (€)","a.immoVal",{type:"number"}):""),
  aside:()=>`<h3>Ce qui n'est pas compté</h3><p>La résidence principale et un bien servant à l'activité professionnelle ne sont pas pris en compte dans le calcul du patrimoine.</p>`,
  ok:()=>S.a.immo,next:()=>"justif"},
justif:{step:4,title:()=>W("Déposer vos pièces justificatives","Déposer les pièces justificatives"),body:()=>{const L=piecesFor(S.a);const need=L.filter(p=>!p.utile),done=need.filter(p=>S.docs[p.code]&&S.docs[p.code].file).length;
  return `<p><b>${done} document${done>1?"s":""} ajouté${done>1?"s":""} sur ${need.length} demandé${need.length>1?"s":""}</b></p><p>Vous pouvez ajouter les justificatifs dès maintenant ou après avoir envoyé la demande, depuis votre espace de suivi.</p>`+
  `<h2>Documents demandés</h2>`+need.map(docBox).join("")+`<h2>Documents utiles à l'examen</h2><p class="small muted">Ils aideront le bureau, sans date limite.</p>`+L.filter(p=>p.utile).map(docBox).join("")},
  aside:()=>`<h3>Formats acceptés</h3><p>Des photos nettes prises au téléphone peuvent convenir. PDF, JPG, PNG et HEIC. 25 Mo au maximum par fichier.</p><h3>Le bureau peut demander des documents supplémentaires.</h3><p>Vous aurez alors un mois pour les envoyer.</p>`,
  ok:()=>true,next:()=>"recap"},
recap:{step:5,title:"Récapitulatif de votre demande",body:()=>{const a=S.a,L=piecesFor(a).filter(p=>!p.utile),miss=L.filter(p=>!(S.docs[p.code]&&(S.docs[p.code].file||S.docs[p.code].indispo))).length;
  const sec=(t,to,rows)=>`<div class="card" style="padding:16px;margin-top:12px"><div class="row"><h3 style="margin:0">${t}</h3><button class="btn ghost sm right" data-act="go" data-to="${to}">Modifier</button></div><dl class="kv" style="margin-top:8px">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${e(v||"—")}</dd>`).join("")}</dl></div>`;
  return `<p>Vérifiez les informations ci-dessous avant d'envoyer la demande. Une fois la demande envoyée, vous ne pourrez plus modifier les informations saisies. Vous pourrez en revanche continuer à ajouter des justificatifs.</p>`+
   (ORG()?sec("Organisme demandeur","orgverif",[["Raison sociale",a.org.raison],["SIRET",a.org.siret],["Siège",a.org.siege],["But non lucratif","Oui"],["Demande déposée par",S.fc.prenom+" "+S.fc.nom]]):REP()?sec("Identité de la personne représentée","represente",[["Nom",a.repr.nom],["Prénoms",a.repr.prenom],["Née le",fr(a.repr.naissance)],["Représentée par",S.fc.prenom+" "+S.fc.nom+", "+QUALITES[a.qualite]]]):sec("Identité","verif",[["Nom",S.fc.nom],["Prénom",S.fc.prenom],["Nationalité",{fr:"Française",ue:"Union européenne",autre:"Autre"}[a.nationalite]]]))+
